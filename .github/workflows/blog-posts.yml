# 每天北京时间 08:00 从博客 RSS 拉最新 5 篇文章，写进 README 的 BLOG-POST-LIST 区块。
# 也可以在 Actions 页面手动点 Run workflow 立刻刷新。
name: Latest blog posts

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 北京 08:00
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["README.md", ".github/workflows/blog-posts.yml"]

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://taigeerniubi.github.io/feed.xml"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"
          tag_post_pre_newline: true   # 列表和前后的注释标记分行，否则 Markdown 不渲染
          date_format: "yyyy-mm-dd"
          template: "- 🔥 **[$title]($url)** <sub>$date</sub>$newline"
          commit_message: "docs: update latest blog posts"
